<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple page for sharing files.">
  <title>Shared files</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
    main { width: min(100%, 680px); background: white; border: 1px solid #e3e8f0; border-radius: 16px; padding: clamp(1.5rem, 5vw, 3rem); box-shadow: 0 12px 35px rgb(23 32 51 / 8%); }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 5vw, 2.4rem); }
    .intro { margin: 0 0 1.75rem; color: #596579; line-height: 1.6; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    li a { display: flex; align-items: center; gap: .75rem; padding: 1rem; border: 1px solid #e3e8f0; border-radius: 10px; color: #155eef; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
    li a:hover, li a:focus-visible { background: #f5f8ff; border-color: #9bb9ff; text-decoration: underline; }
    .icon { flex: 0 0 auto; font-size: 1.2rem; }
    .empty { padding: 1rem; background: #f7f9fc; border-radius: 10px; color: #596579; line-height: 1.6; }
    footer { margin-top: 1.5rem; color: #748096; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Shared files</h1>
    <p class="intro">Choose a file below to open or download it.</p>

    <ul aria-label="Available files">
      <!-- Add a list item for each uploaded file, using its repository path, for example:
      <li><a href="files/example.pdf"><span class="icon" aria-hidden="true">📄</span> example.pdf</a></li>
      -->
    </ul>
    <p class="empty">No files are listed yet. Upload your files to this repository, then add a link for each one here.</p>
    <footer>Files will be available to visitors only if the website and repository access settings allow it.</footer>
  </main>
</body>
</html>
